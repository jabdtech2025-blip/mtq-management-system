name: MTQ E-Scoring CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  verify-and-test:
    name: Typecheck, Unit/Integration Tests, Build & E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies (Clean Lockfile)
        run: npm ci

      - name: Production Dependency Security Audit
        run: npm audit --omit=dev --audit-level=high

      - name: TypeScript Static Typecheck (Lint)
        run: npm run lint

      - name: Unit, Integration & Supabase RLS Security Tests (tsx)
        run: npm run test

      - name: Production Bundle Build (Vite)
        run: npm run build

      - name: Install Playwright Chromium Browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Audit Suite (Demo Mode)
        env:
          E2E_LIVE_ENABLED: 'false'
        run: npm run test:e2e

      - name: Upload Playwright Failure Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
