name: MTQ Management System CI Pipeline

on:
  push:
    branches: [ main, fix/p0-production-hardening ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Run Domain & Business Rules Tests
        run: npm test

      - name: Run TypeScript Type Check & Linter
        run: npm run lint

      - name: Build Production Application
        run: npm run build
